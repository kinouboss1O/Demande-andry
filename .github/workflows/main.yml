name: Déployer tout le site sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer tous les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer tout
        uses: actions/deploy-pages@v4
